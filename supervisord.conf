[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:api]
; PORT=3001 is set explicitly so EasyPanel's injected PORT (80) never reaches the API process.
; All other container env vars (SUPABASE_DB_URL, NODE_ENV, etc.) are still inherited.
command=/usr/bin/env PORT=3001 node --enable-source-maps /app/artifacts/api-server/dist/index.mjs
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
