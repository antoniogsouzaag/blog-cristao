kind = "web"
previewPath = "/"
title = "Blog Cristão"
version = "1.0.0"
id = "artifacts/christian-blog"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20166

[services.development]
run = "pnpm --filter @workspace/christian-blog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/christian-blog", "run", "build" ]
publicDir = "artifacts/christian-blog/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20166"
BASE_PATH = "/"
