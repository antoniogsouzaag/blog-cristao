version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: blog-cristao-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      # Se usar Supabase:
      # SUPABASE_DB_URL: ${SUPABASE_DB_URL}
    ports:
      - "3001:3001"
    networks:
      - blog-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: blog-cristao-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - blog-net

networks:
  blog-net:
    driver: bridge
