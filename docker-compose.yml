version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: blog-cristao-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
    expose:
      - "3001"
    networks:
      - blog-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: blog-cristao-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - blog-net

networks:
  blog-net:
    driver: bridge
